name: Daily MIR and SBP news

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore sent-news state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: ${{ runner.os }}-news-state-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-news-state-

      - name: Install agent
        run: python -m pip install .

      - name: Collect and email news
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          SMTP_TIMEOUT: ${{ secrets.SMTP_TIMEOUT }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          SUMMARIZE_ENABLED: "true"
          NEWS_MAX_AGE_HOURS: "48"
          NEWS_LIMIT_PER_BRAND: "20"
          STATE_FILE: state/sent.json
        run: nspk-sbp-news-agent

      - name: Save sent-news state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: state
          key: ${{ runner.os }}-news-state-${{ github.run_id }}
